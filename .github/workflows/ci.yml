name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  rust-core:
    name: Rust core checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/ufc-core

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy -p ufc-core --all-targets -- -D warnings

      - name: Unit and integration tests
        run: cargo test -p ufc-core

      - name: Generated TypeScript bindings are up to date
        run: ./scripts/check-types-drift.sh

  rust-engines:
    name: Rust engine checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The integration test of the PNG to JPEG pair performs a real
      # conversion, so ImageMagick 7 has to be installed on the runner.
      # The distribution packages ship ImageMagick 6, which is a
      # different program with a different command line.
      - name: Install ImageMagick 7
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y software-properties-common
          sudo add-apt-repository -y ppa:dcreurope/imagemagick7
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y imagemagick

      - name: Check the engine version
        run: |
          magick -version
          if ! magick -version | grep -q "Version: ImageMagick 7"; then
            echo "ImageMagick 7 is required for the integration test." >&2
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/ufc-engines

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy -p ufc-engines --all-targets -- -D warnings

      - name: Unit and integration tests
        run: cargo test -p ufc-engines

      - name: Generate the test fixtures
        run: node scripts/generate-fixtures.mjs

      - name: Integration test with the repository fixtures
        run: cargo test -p ufc-engines --test conversion_png_to_jpeg

  rust-desktop:
    name: Rust desktop checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy -p universal-file-converter --all-targets -- -D warnings

      - name: Unit and integration tests
        run: cargo test -p universal-file-converter
